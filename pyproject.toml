[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wow-addon-agy"
version = "1.3.1"
description = "In-game Google Antigravity (AGY) AI Guide & Lua Code Studio for World of Warcraft: Forever (Interface: 16001)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-antigravity>=0.1.0",
]

[project.optional-dependencies]
litert = [
    "litert-lm",
]

[project.scripts]
wow-agy-daemon = "bridge.daemon:main"
wow-agy-mcp = "bridge.mcp_server:serve_stdio"

[tool.setuptools]
packages = ["bridge"]

