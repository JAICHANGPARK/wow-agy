[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wow-agy"
version = "2026.11.17"
description = "In-game Google Antigravity (AGY) AI Guide & Lua Code Studio for World of Warcraft: Forever (Interface: 16001)"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "JAICHANGPARK (Dreamwalker)" },
]
requires-python = ">=3.13"
dependencies = [
    "google-antigravity>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/JAICHANGPARK/wow-agy"
Repository = "https://github.com/JAICHANGPARK/wow-agy"
Issues = "https://github.com/JAICHANGPARK/wow-agy/issues"

[project.optional-dependencies]
litert = [
    "litert-lm",
]

[project.scripts]
wow-agy-daemon = "bridge.daemon:main"
wow-agy-mcp = "bridge.mcp_server:serve_stdio"

[tool.setuptools]
packages = ["bridge"]

